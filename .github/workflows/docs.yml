name: Docs

# Builds the user guide (site/, Fumadocs on Next.js) as a static export and
# checks its links. On main it also publishes the site to GitHub Pages
# (https://redis-pane.github.io/redis-pane, source: GitHub Actions). A failed
# deploy fails the run.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: site build · link check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in site/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm build
      # The site lives under /redis-pane/, so its links are root-relative with
      # that prefix. Stage the export under a directory of that name so the
      # checker can resolve them.
      - name: Stage for the link check
        run: |
          mkdir -p "$RUNNER_TEMP/linkcheck"
          cp -R out "$RUNNER_TEMP/linkcheck/redis-pane"
      # Internal links and #fragments only: --offline never touches the network,
      # so an external site being down cannot fail the build. 404.html is
      # excluded because it links to the site root, which only exists on Pages.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress --exclude-path 404.html
            --index-files index.html
            --root-dir ${{ runner.temp }}/linkcheck ${{ runner.temp }}/linkcheck/redis-pane
          fail: true
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A separate job, so the build and the link check never depend on Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

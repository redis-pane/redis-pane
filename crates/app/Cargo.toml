# redis-pane — the imperative shells around the core (ADR-0011).
#
# Everything that touches the outside world lives here: the terminal, the Redis
# connection, the filesystem, and the clock.
[package]
name = "redis-pane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal UI for Redis: browse keys, watch them change live, edit safely"
homepage = "https://redis-pane.github.io/redis-pane/"
repository.workspace = true

[[bin]]
name = "redis-pane"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
fred = { version = "10.1", features = ["i-server", "i-keys", "i-tracking", "i-memory", "i-hashes", "i-lists", "i-sets", "i-sorted-sets", "i-streams", "i-scripts", "i-slowlog", "enable-rustls-ring", "monitor", "subscriber-client", "replicas", "i-cluster"] }
futures = "0.3.34"
ratatui = { version = "0.30", features = ["crossterm"] }
redis-pane-core = { path = "../core" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = "0.7.19"

[dev-dependencies]
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.19"

# musl's allocator is several times slower than glibc's on the allocation-heavy paths
# (ScanBatch, scroll, Space); mimalloc restores the gnu figures. musl targets only, and only
# here: the core never names an allocator (ADR-0023, docs/plans/packaging-and-1.0.md).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0-beta.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/vinodsantharam/redis-pane"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# `true` is Cargo's alias for `strip = "symbols"` (removes both the symbol
# table and debug info) — not a looser alternative to it, so "true vs
# symbols" is not actually a choice between two different outcomes. The real
# alternative is `strip = "debuginfo"`, which keeps the symbol table so a
# `RUST_BACKTRACE=1` panic still names functions, just without line numbers.
# `true`/`"symbols"` is used here: this project's own rule is "never panic!
# on a Redis error" (CLAUDE.md), so a release-build panic is a bug report,
# not a supported diagnostic path, and reproducing one is done against a
# debug build locally rather than by reading a stripped release backtrace.
# The panic message itself (what `assert!`/`panic!` print) is a static
# string baked in at compile time and is unaffected by stripping either way.
strip = true
